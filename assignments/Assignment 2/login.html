<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
        }

        .login {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border: 1px solid black;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
        }
    </style>

</head>

<body>

    <div class="login">

        <h2>Login</h2>

        <form>

            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email">

            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password">

            <button type="submit">Login</button>

        </form>

    </div>

</body>

</html>
