<!DOCTYPE html>
<html>
<head>
    <title>Student Marksheet</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Student Marksheet</h1>

    <table>

        <tr>
            <th>Subject</th>
            <th>Max Marks</th>
            <th>Marks Obtained</th>
        </tr>

        <tr>
            <td>Data Science</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Data Structures and Algorithms</td>
            <td>100</td>
            <td>78</td>
        </tr>

        <tr>
            <td>Frontend Technology</td>
            <td>100</td>
            <td>92</td>
        </tr>

        <tr>
            <td>OOPS</td>
            <td>100</td>
            <td>80</td>
        </tr>

        <tr>
            <th>Total</th>
            <th>400</th>
            <th>335</th>
        </tr>

    </table>

</body>
</html>
